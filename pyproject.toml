[project]
name = "tender-collector"
version = "0.1.0"
description = "International public procurement collector (TED/SAM.gov/UK CF) for B2B outreach signals"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
